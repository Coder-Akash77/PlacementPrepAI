services:
  - type: web
    name: placementprepai-backend
    runtime: python
    rootDir: backend
    plan: free
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CHROMA_DIR
        value: ./data/chroma
      - key: UPLOAD_DIR
        value: ./data/uploads
      - key: HISTORY_DB_PATH
        value: ./data/history.db
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
  - type: web
    name: placementprepai-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
